<div id="app" class="app"><div id="boot-screen" style="padding:48px 24px;text-align:center;color:#8b98ab;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif">Loading SaccoPro…</div></div>
<noscript><div style="padding:32px;color:#e6edf7;font:14px system-ui,sans-serif">SaccoPro needs JavaScript enabled in your browser.</div></noscript>
<div id="toast-root"></div>
<div id="sheet-root"></div>

<style>
  #boot-warning{display:none;position:fixed;inset:0;z-index:99999;background:#04070d;color:#e6edf7;font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:28px;overflow:auto}
  #boot-warning h1{font-size:18px;margin:0 0 10px}
  #boot-warning p{margin:0 0 12px;max-width:640px}
  #boot-warning pre{white-space:pre-wrap;word-break:break-word;background:#0b1524;border:1px solid #22314a;border-radius:10px;padding:12px;font-size:12px;color:#9fb3cd;max-width:640px}
  #boot-warning .hint{color:#8b98ab;font-size:12px}
</style>
<script>
/* Fail-safe: if a deployed copy is missing files or a script crashes, show
   the reason instead of a silent white screen. Disappears on a normal start. */
(function () {
  var shown = false;
  function rendered() {
    return !!(window.Store && window.Cloud && window.H && !document.getElementById("boot-screen"));
  }
  window.__bootFail = function (err) {
    if (shown || rendered()) return;
    shown = true;
    var el = document.createElement("div");
    el.id = "boot-warning";
    el.style.display = "block";
    el.innerHTML = '<h1>SaccoPro could not start</h1>' +
      '<p>The page loaded, but the app files did not. Make sure the whole <b>SaccoPro-Web</b> folder (index.html, js/, css/, assets/) was uploaded to the deployment root — not the parent folder.</p>' +
      '<pre></pre><p class="hint">URL: ' + location.href + '</p>';
    el.querySelector("pre").textContent = String(err || "Unknown error");
    document.body.appendChild(el);
  };
  window.addEventListener("error", function (e) {
    if (!e) return;
    if (e.filename || e.message) window.__bootFail((e.message || "Script error") + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    try { window.__bootFail("Unhandled: " + ((e.reason && (e.reason.message || e.reason)) || "unknown")); } catch (_) {}
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (!rendered()) window.__bootFail("The app scripts did not run. A required file is missing from the deployment root.");
    }, 3000);
  });
})();
</script>
<script src="js/vendor/supabase.js" onerror="window.__bootFail('Missing file: js/vendor/supabase.js')"></script>
<script src="js/data.js" onerror="window.__bootFail('Missing file: js/data.js')"></script>
<script src="js/cloud.js" onerror="window.__bootFail('Missing file: js/cloud.js')"></script>
<script src="js/app.js" onerror="window.__bootFail('Missing file: js/app.js')"></script>
<script>
/* Web build only: installable + offline shell. The native app never runs
   this (window.Capacitor is present inside the Android WebView). */
if (!window.Capacitor && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
